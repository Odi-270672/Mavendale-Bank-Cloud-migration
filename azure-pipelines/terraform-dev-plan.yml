# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform/**
      - azure-pipelines/terraform-dev-plan.yml

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: Validate
    displayName: 'Validate Mavendale Pipeline'
    jobs:
      - job: TestPipeline
        displayName: 'Test pipeline execution'
        steps:
          - script: echo "Mavendale Bank Terraform pipeline initialised"
            displayName: 'Verify pipeline execution'

          - bash: |
              set -e
              curl -fsSLo /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.14.4/terraform_1.14.4_linux_amd64.zip
              unzip -o /tmp/terraform.zip terraform -d /tmp
              sudo install /tmp/terraform /usr/local/bin/terraform
            displayName: 'Install Terraform 1.14.4'
            
          - script: terraform version
            displayName: 'Check Terraform version'

          - task: AzureCLI@2
            displayName: 'Verify Azure authentication'
            inputs:
              azureSubscription: 'sc-mavendale-terraform-dev-uks'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              inlineScript: |
                set -e

                export ARM_USE_OIDC=true
                export ARM_USE_AZUREAD=true
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_TENANT_ID="$tenantId"
                export ARM_OIDC_TOKEN="$idToken"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                cd terraform
                terraform fmt -check -recursive
                terraform init -input=false
                terraform validate
                terraform plan -input=false
