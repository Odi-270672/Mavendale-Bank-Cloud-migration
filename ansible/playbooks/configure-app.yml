---
- name: Configure Mavendale Bank App Tier
  hosts: app
  become: true

  tasks: 
     - name: Install Python3
       ansible.builtin.apt:
         name: python3
         state: present

     - name: Create Banking API Directory
       ansible.builtin.file:
         path: /opt/mavendale/banking-api
         state: directory
         mode: "0755"

     - name: Install Python package management tools
       ansible.builtin.apt:
        name:
          - python3-pip
          - python3-venv
        state: present
        update_cache: true

     - name: Create Banking API virtual environment
       ansible.builtin.command:
         cmd: python3 -m venv /opt/mavendale/banking-api/venv
         creates: /opt/mavendale/banking-api/venv/bin/python

     - name: Install SQL Python driver
       ansible.builtin.pip:
         name: pymssql
         virtualenv: /opt/mavendale/banking-api/venv

     - name: Deploy Mavendale Banking API
       ansible.builtin.copy:
         src: ../../application/banking-api/app.py
         dest: /opt/mavendale/banking-api/app.py
         owner: root
         group: root
         mode: '0644'

     - name: Deploy Banking API systemd Service 
       ansible.builtin.template:
          src: 	../templates/mavendale-banking-api.service.j2
          dest: 	/etc/systemd/system/mavendale-banking-api.service
          owner: root
          group: root
          mode: '0644'

     - name: Enable and Start Banking API
       ansible.builtin.systemd_service:
          name: mavendale-banking-api
          state: started
          enabled: true
          daemon_reload: true